[project]
name = "osrs-calc-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # isort — keep imports sorted as the calculator registry grows
